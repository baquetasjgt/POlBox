<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>POLEBOX · Prototipo</title>
<style>
/* ============================================================
   POLEBOX — Colors & Type tokens
   Light-first design system for the POLEBOX app & marketing.
   ============================================================ */

/* ---------- FONTS ----------------------------------------- */
/* Primary: Archivo (geometric grotesque, close to the mark's
   wide/bold wordmark). Display use SemiBold/Bold.
   Secondary (numeric / mono): JetBrains Mono for timers & codes.
   Both loaded from Google Fonts — see README for substitution notes. */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  /* ---------- BRAND CORE ---------- */
  --pb-morado:        #482380;   /* Morado Marca — primary brand */
  --pb-morado-deep:   #35196A;   /* hover / pressed */
  --pb-morado-ink:    #1D0D3E;   /* text on mint / deepest shade */
  --pb-menta:         #80E3B7;   /* Menta Marca — secondary brand */
  --pb-menta-soft:    #C6F2DD;   /* tinted surface */
  --pb-menta-deep:    #4FBE8A;   /* hover on mint chips / accents */

  /* ---------- NEUTRALS (light theme) ---------- */
  --pb-bg:            #FAFAF7;   /* page background — warm off-white */
  --pb-surface:       #FFFFFF;   /* cards */
  --pb-surface-2:     #F3F2EE;   /* subtle panel / muted card */
  --pb-surface-3:     #E8E6E0;   /* inputs, chips resting */
  --pb-line:          #E2E0D8;   /* hairline dividers */
  --pb-line-strong:   #C9C6BC;   /* stronger borders */

  --pb-ink:           #141318;   /* primary text, near-black */
  --pb-ink-2:         #3A3742;   /* secondary text */
  --pb-ink-3:         #6B6776;   /* tertiary / meta */
  --pb-ink-4:         #A19DAB;   /* disabled / placeholder */

  /* ---------- TINTS (on brand surfaces) ---------- */
  --pb-on-morado:     #FFFFFF;
  --pb-on-morado-dim: #D6C9EF;
  --pb-on-menta:      var(--pb-morado-ink);

  /* ---------- SEMANTIC ---------- */
  --pb-success:       #238F5B;
  --pb-success-bg:    #E4F6EC;
  --pb-warn:          #B67A12;
  --pb-warn-bg:       #FBF0D9;
  --pb-danger:        #B23040;
  --pb-danger-bg:     #FBE6E9;
  --pb-info:          var(--pb-morado);
  --pb-info-bg:       #ECE4F9;

  /* ---------- TYPE SYSTEM ---------- */
  --pb-font-display:  'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --pb-font-body:     'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --pb-font-mono:     'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Display scale — condensed, wide-bold like the wordmark */
  --pb-h1-size:       56px; --pb-h1-lh: 1.02; --pb-h1-weight: 800; --pb-h1-track: -0.02em;
  --pb-h2-size:       40px; --pb-h2-lh: 1.05; --pb-h2-weight: 800; --pb-h2-track: -0.015em;
  --pb-h3-size:       28px; --pb-h3-lh: 1.15; --pb-h3-weight: 700; --pb-h3-track: -0.01em;
  --pb-h4-size:       20px; --pb-h4-lh: 1.25; --pb-h4-weight: 700; --pb-h4-track: -0.005em;

  /* Body */
  --pb-body-size:     16px; --pb-body-lh: 1.5;
  --pb-small-size:    14px; --pb-small-lh: 1.45;
  --pb-tiny-size:     12px; --pb-tiny-lh: 1.35;

  /* Eyebrow / UPPERCASE labels — signature brand tic */
  --pb-eyebrow-size:  12px; --pb-eyebrow-weight: 700; --pb-eyebrow-track: 0.16em;

  /* Mono (timers, prices, DNI codes) */
  --pb-mono-size:     16px;

  /* ---------- SPACING / RADIUS / ELEVATION ---------- */
  --pb-space-0:  0;
  --pb-space-1:  4px;
  --pb-space-2:  8px;
  --pb-space-3:  12px;
  --pb-space-4:  16px;
  --pb-space-5:  20px;
  --pb-space-6:  24px;
  --pb-space-8:  32px;
  --pb-space-10: 40px;
  --pb-space-12: 48px;
  --pb-space-16: 64px;

  --pb-radius-xs:  6px;
  --pb-radius-sm:  10px;
  --pb-radius-md:  14px;  /* standard chip / input */
  --pb-radius-lg:  20px;  /* card */
  --pb-radius-xl:  28px;  /* hero card / bottom sheet */
  --pb-radius-pill: 999px;

  --pb-shadow-1: 0 1px 2px rgba(20,19,24,.04), 0 1px 1px rgba(20,19,24,.03);
  --pb-shadow-2: 0 4px 14px rgba(20,19,24,.06), 0 1px 2px rgba(20,19,24,.04);
  --pb-shadow-3: 0 14px 40px rgba(72,35,128,.12), 0 2px 6px rgba(20,19,24,.05);
  --pb-shadow-inset: inset 0 0 0 1px var(--pb-line);

  /* Motion — snappy, confident, no bounce */
  --pb-ease:       cubic-bezier(.2, .7, .2, 1);
  --pb-ease-out:   cubic-bezier(0, .6, .2, 1);
  --pb-dur-fast:   120ms;
  --pb-dur:        220ms;
  --pb-dur-slow:   400ms;
}

/* ---------- SEMANTIC ELEMENTS --------------------------- */
html, body {
  background: var(--pb-bg);
  color: var(--pb-ink);
  font-family: var(--pb-font-body);
  font-size: var(--pb-body-size);
  line-height: var(--pb-body-lh);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, .pb-h1 {
  font-family: var(--pb-font-display);
  font-size: var(--pb-h1-size); line-height: var(--pb-h1-lh);
  font-weight: var(--pb-h1-weight); letter-spacing: var(--pb-h1-track);
  margin: 0; color: var(--pb-ink);
}
h2, .pb-h2 {
  font-family: var(--pb-font-display);
  font-size: var(--pb-h2-size); line-height: var(--pb-h2-lh);
  font-weight: var(--pb-h2-weight); letter-spacing: var(--pb-h2-track);
  margin: 0; color: var(--pb-ink);
}
h3, .pb-h3 {
  font-family: var(--pb-font-display);
  font-size: var(--pb-h3-size); line-height: var(--pb-h3-lh);
  font-weight: var(--pb-h3-weight); letter-spacing: var(--pb-h3-track);
  margin: 0; color: var(--pb-ink);
}
h4, .pb-h4 {
  font-family: var(--pb-font-display);
  font-size: var(--pb-h4-size); line-height: var(--pb-h4-lh);
  font-weight: var(--pb-h4-weight); letter-spacing: var(--pb-h4-track);
  margin: 0; color: var(--pb-ink);
}
p, .pb-body { font-size: var(--pb-body-size); line-height: var(--pb-body-lh); color: var(--pb-ink-2); margin: 0; }
small, .pb-small { font-size: var(--pb-small-size); line-height: var(--pb-small-lh); color: var(--pb-ink-3); }
.pb-tiny { font-size: var(--pb-tiny-size); line-height: var(--pb-tiny-lh); color: var(--pb-ink-3); }

.pb-eyebrow {
  font-size: var(--pb-eyebrow-size);
  font-weight: var(--pb-eyebrow-weight);
  letter-spacing: var(--pb-eyebrow-track);
  text-transform: uppercase;
  color: var(--pb-morado);
}
.pb-mono { font-family: var(--pb-font-mono); font-variant-numeric: tabular-nums; }

a { color: var(--pb-morado); text-underline-offset: 3px; }
hr { border: 0; border-top: 1px solid var(--pb-line); }
::selection { background: var(--pb-menta); color: var(--pb-morado-ink); }

  html, body { margin: 0; padding: 0; background: #EDEBE3; }
  #root { min-height: 100vh; }
  button:focus-visible { outline: 2px solid #482380; outline-offset: 2px; }
  *::-webkit-scrollbar { width: 0; height: 0; }
</style>

<script type="text/babel">
// POLEBOX app — shared atoms & icons. Light theme.
// Reads tokens from colors_and_type.css.

const PB = {
  morado: '#482380', moradoDeep: '#35196A', moradoInk: '#1D0D3E',
  menta: '#80E3B7', mentaSoft: '#C6F2DD', mentaDeep: '#4FBE8A',
  bg: '#FAFAF7', surface: '#FFFFFF', surface2: '#F3F2EE', surface3: '#E8E6E0',
  line: '#E2E0D8', lineStrong: '#C9C6BC',
  ink: '#141318', ink2: '#3A3742', ink3: '#6B6776', ink4: '#A19DAB',
  success: '#238F5B', successBg: '#E4F6EC',
  warn: '#B67A12', warnBg: '#FBF0D9',
  danger: '#B23040', dangerBg: '#FBE6E9',
  font: 'Archivo, system-ui, -apple-system, sans-serif',
  mono: '"JetBrains Mono", ui-monospace, Menlo, monospace',
};

  const paths = {

    check:    <><path d="M20 6L9 17l-5-5"/></>,
    plus:     <><path d="M12 5v14M5 12h14"/></>,
    refresh:  <><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></>,
    sparkle:  <><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></>,
    music:    <><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></>,

// ── Status bar (mocked iOS) ──────────────────────────────────
const StatusBar = ({ dark = false }) => {
  const c = dark ? '#fff' : PB.ink;
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      padding: '14px 24px 6px', fontFamily: '-apple-system, SF Pro, system-ui',
      fontSize: 15, fontWeight: 600, color: c }}>
      <span>9:41</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <svg width="17" height="11" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx=".7" fill={c}/><rect x="4.8" y="5" width="3.2" height="7" rx=".7" fill={c}/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx=".7" fill={c}/><rect x="14.4" y="0" width="3.2" height="12" rx=".7" fill={c}/></svg>

      </div>
    </div>
  );
};

// ── Phone shell ──────────────────────────────────────────────
const Phone = ({ children, bg = PB.bg, label }) => (
  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
    <div style={{
      width: 390, height: 844, borderRadius: 54, padding: 10,
      background: '#0d0c10', boxShadow: '0 30px 80px rgba(29,13,62,.18), 0 10px 24px rgba(20,19,24,.12)',
      position: 'relative',
    }}>
      <div style={{ width: '100%', height: '100%', borderRadius: 44, overflow: 'hidden',
        background: bg, position: 'relative', display: 'flex', flexDirection: 'column' }}>
        {/* notch */}
        <div style={{ position: 'absolute', top: 8, left: '50%', transform: 'translateX(-50%)',
          width: 120, height: 32, borderRadius: 999, background: '#0d0c10', zIndex: 30 }}/>
        {children}
      </div>
    </div>
    {label && <div style={{ fontFamily: PB.font, fontWeight: 700, fontSize: 12, letterSpacing: '.14em', textTransform: 'uppercase', color: PB.ink3 }}>{label}</div>}
  </div>
);

// ── Bottom tab bar ───────────────────────────────────────────
const TabBar = ({ active = 'home', locked = {}, onTab = () => {} }) => {
  const items = [
    { id: 'home', label: 'Inicio', icon: 'home' },
    { id: 'reservas', label: 'Reservas', icon: 'calendar' },
    { id: 'llave', label: 'Llave', icon: 'key' },
    { id: 'perfil', label: 'Perfil', icon: 'profile' },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0, padding: '10px 14px 26px',
      background: 'rgba(255,255,255,.92)', backdropFilter: 'blur(14px)',
      borderTop: `1px solid ${PB.line}`, display: 'flex', gap: 4,
    }}>
      {items.map(it => {
        const isActive = it.id === active;
        const isLocked = locked[it.id];
        return (
          <button key={it.id} onClick={() => !isLocked && onTab(it.id)} style={{
            flex: 1, background: 'transparent', border: 0, padding: '6px 4px',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
            color: isActive ? PB.morado : (isLocked ? PB.ink4 : PB.ink3),
            opacity: isLocked ? .55 : 1, cursor: isLocked ? 'not-allowed' : 'pointer',
            fontFamily: PB.font, position: 'relative',
          }}>
            <div style={{
              width: 52, height: 32, borderRadius: 999,
              display: 'grid', placeItems: 'center',
              background: isActive ? PB.morado : 'transparent',
              color: isActive ? '#fff' : 'currentColor',
              transition: 'background 220ms',
            }}>
              <Icon name={it.icon} size={20}/>
              {isLocked && (
                <div style={{ position: 'absolute', top: 2, right: 14, width: 14, height: 14, borderRadius: 999,
                  background: PB.surface3, display: 'grid', placeItems: 'center' }}>
                  <Icon name="lock" size={9} color={PB.ink3}/>
                </div>
              )}
            </div>
            <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase' }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
};

const Button = ({ children, onClick, variant = 'primary', full = false, icon, style = {} }) => {
  const styles = {
    primary:  { background: PB.morado, color: '#fff', border: '0' },
    secondary:{ background: PB.surface, color: PB.ink, border: `1px solid ${PB.lineStrong}` },
    tertiary: { background: 'transparent', color: PB.morado, border: '0' },
    mint:     { background: PB.menta, color: PB.moradoInk, border: '0' },
    danger:   { background: PB.dangerBg, color: PB.danger, border: '0' },
  }[variant];
  return (
    <button onClick={onClick} style={{
      ...styles, padding: '15px 20px', borderRadius: 14, fontFamily: PB.font, fontWeight: 700,
      fontSize: 15, letterSpacing: '-.005em', cursor: 'pointer',

      transition: 'all 220ms cubic-bezier(.2,.7,.2,1)', ...style,
    }}>
      {icon && <Icon name={icon} size={18}/>}
      {children}
    </button>
  );
};

<script type="text/babel">
// POLEBOX — Screen 3: Calendar / Book (duration-first funnel, anti-gap slots)

const Screen3Book = ({ onBack, onPay }) => {
  const [dayIdx, setDayIdx] = React.useState(0); // hoy por defecto
  const [boxIdx, setBoxIdx] = React.useState(0);
  const [duration, setDuration] = React.useState(90); // default: Recomendado
  const [startMin, setStartMin] = React.useState(null); // minutes from 00:00

  // 10 días a partir de hoy
  const days = React.useMemo(() => {
    const dowShort = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
    const today = new Date();
    return Array.from({ length: 10 }, (_, i) => {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      return { d: dowShort[d.getDay()], n: d.getDate(), isToday: i === 0 };
    });
  }, []);

  // Bloques de duración
  const durations = [
    { min: 45,  price: 12, label: '45 min', tag: 'Repaso rápido' },
    { min: 60,  price: 15, label: '60 min', tag: 'Sesión estándar' },
    { min: 90,  price: 20, label: '90 min', tag: 'Recomendado', featured: true },
    { min: 120, price: 25, label: '120 min', tag: 'Modo máster' },
  ];
  const current = durations.find(d => d.min === duration);

  // Reservas existentes del día (min from 00:00) — por box
  // Box 0: 10:00–11:00, 12:00–13:30, 17:00–18:00
  // Box 1: 11:00–12:30, 15:00–16:00, 19:00–20:30
  const existingByBox = [
    [ {s: 600,  e: 660}, {s: 720,  e: 810},  {s: 1020, e: 1080} ],
    [ {s: 660,  e: 750}, {s: 900,  e: 960},  {s: 1140, e: 1230} ],
  ];
  const existing = existingByBox[boxIdx];

  // Ventana operativa: 10:00 a 23:00
  const OPEN = 600, CLOSE = 1380;

  // ─── Anti-gap slot generator ─────────────────────────────
  // Candidato válido de arranque si:
  //  a) pegado a una reserva anterior (= end de otra) o al OPEN,
  //  b) su fin está pegado a una reserva posterior (= start de otra) o al CLOSE,
  //  c) cae en :00 o :30 (ritmo del grid),
  // y no pisa ninguna reserva.
  const candidates = React.useMemo(() => {
    const starts = new Set();
    // Anclas "pegadas": inicios pegados a algo → no genera hueco previo
    starts.add(OPEN);
    existing.forEach(r => starts.add(r.e));
    // Extra: cada :00 y :30 entre OPEN y CLOSE (se filtra abajo si crea huecos)
    for (let t = OPEN; t <= CLOSE - duration; t += 30) starts.add(t);

    const list = [];
    [...starts].sort((a,b) => a-b).forEach(s => {
      const e = s + duration;
      if (s < OPEN || e > CLOSE) return;
      // no solapa con existentes
      if (existing.some(r => !(e <= r.s || s >= r.e))) return;
      // gap-previo: o empieza en OPEN, o en end de alguna reserva, o en una ancla :00/:30 permitida (sin crear gap <30 min contra reserva previa)
      const prev = existing.filter(r => r.e <= s).sort((a,b) => b.e - a.e)[0];
      const prevEnd = prev ? prev.e : OPEN;
      const gapBefore = s - prevEnd;
      if (gapBefore > 0 && gapBefore < 30) return; // hueco muerto <30 min ⇒ oculto
      // gap-posterior
      const next = existing.filter(r => r.s >= e).sort((a,b) => a.s - b.s)[0];
      const nextStart = next ? next.s : CLOSE;
      const gapAfter = nextStart - e;
      if (gapAfter > 0 && gapAfter < 30) return;
      list.push(s);
    });
    return list;
  }, [duration, boxIdx]);

  const fmt = (m) => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

const inputStyle = (pos) => {
  const r = { all: 6, top: '6px 6px 0 0', bl: '0 0 0 6px', br: '0 0 6px 0' }[pos] ?? 6;
  return {
    width: '100%', boxSizing: 'border-box',
    padding: '11px 12px', border: '1px solid #E3E8EE',
    borderRadius: typeof r === 'number' ? r : undefined,
    borderTopLeftRadius:    pos === 'top' || pos === 'all' ? 6 : (pos === 'bl' ? 0 : pos === 'br' ? 0 : 0),
    borderTopRightRadius:   pos === 'top' || pos === 'all' ? 6 : 0,
    borderBottomLeftRadius: pos === 'bl'  || pos === 'all' ? 6 : 0,
    borderBottomRightRadius:pos === 'br'  || pos === 'all' ? 6 : 0,
    borderTop: pos === 'bl' || pos === 'br' ? 0 : '1px solid #E3E8EE',
    fontFamily: 'system-ui', fontSize: 14, color: '#1a1f36',
    background: '#fff', outline: 'none',
  };
};
const Field = ({ label, children }) => (

</script>
<script type="text/babel">
// POLEBOX — Screen 4: Digital Key (live access + domotics)

const Screen4Key = ({ onBack }) => {
  const [streetUnlocked, setStreetUnlocked] = React.useState(false);
  const [boxUnlocked, setBoxUnlocked] = React.useState(false);
  const [light, setLight] = React.useState('neon');
  const [remaining, setRemaining] = React.useState(45 * 60 + 20);
  React.useEffect(() => {
    const t = setInterval(() => setRemaining(r => Math.max(0, r - 1)), 1000);
    return () => clearInterval(t);
  }, []);
  const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
  const ss = String(remaining % 60).padStart(2, '0');

  // progress for circular: 45:20 out of 60:00
  const total = 60 * 60;
  const pct = remaining / total;
  const R = 88, C = 2 * Math.PI * R;

  const Slider = ({ label, unlocked, onUnlock }) => {
    const [dx, setDx] = React.useState(0);
    const trackRef = React.useRef(null);
    const [dragging, setDragging] = React.useState(false);
    const startRef = React.useRef(0);
    const onStart = (clientX) => {
      if (unlocked) return;
      setDragging(true); startRef.current = clientX - dx;
    };
    const onMove = (clientX) => {
      if (!dragging) return;
      const w = trackRef.current?.offsetWidth || 300;
      const max = w - 62;
      const nx = Math.max(0, Math.min(max, clientX - startRef.current));
      setDx(nx);
      if (nx >= max - 4) { onUnlock(); setDragging(false); }
    };
    const onEnd = () => { if (dragging && dx < (trackRef.current?.offsetWidth || 300) - 66) setDx(0); setDragging(false); };
    return (
      <div
        ref={trackRef}
        onMouseDown={(e) => onStart(e.clientX)}
        onMouseMove={(e) => onMove(e.clientX)}
        onMouseUp={onEnd}
        onMouseLeave={onEnd}
        onTouchStart={(e) => onStart(e.touches[0].clientX)}
        onTouchMove={(e) => onMove(e.touches[0].clientX)}
        onTouchEnd={onEnd}
        style={{
          position: 'relative', height: 62, borderRadius: 999,
          background: unlocked ? PB.successBg : PB.surface,
          border: `1px solid ${unlocked ? PB.success : PB.line}`,
          overflow: 'hidden', userSelect: 'none', touchAction: 'none',
        }}>
        <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: PB.font, fontWeight: 700, fontSize: 13, letterSpacing: '.1em', textTransform: 'uppercase',
          color: unlocked ? PB.success : PB.ink3, pointerEvents: 'none',
        }}>
          {unlocked ? <><Icon name="check" size={18}/>&nbsp; Puerta abierta</> : label}
        </div>
        {/* Knob */}
        {!unlocked && (
          <div style={{
            position: 'absolute', top: 5, left: 5 + dx, width: 52, height: 52, borderRadius: 999,
            background: PB.morado, display: 'grid', placeItems: 'center', color: '#fff',
            boxShadow: '0 6px 16px rgba(72,35,128,.35)', cursor: 'grab',
            transition: dragging ? 'none' : 'left 220ms cubic-bezier(.2,.7,.2,1)',
          }}>
            <Icon name="arrow" size={20} color="#fff"/>
          </div>
        )}
      </div>
    );
  };

  const lights = [
    { id: 'neon',  label: 'Neón',      color: '#E9A0E3' },
    { id: 'warm',  label: 'Cálido',    color: '#F0B867' },
    { id: 'rec',   label: 'Grabación', color: '#F5F2E6' },
  ];

  return (
    <>
      <StatusBar/>
      <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 110 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 16px 8px' }}>
          <button onClick={onBack} style={{ width: 40, height: 40, borderRadius: 12, border: `1px solid ${PB.line}`, background: PB.surface, display: 'grid', placeItems: 'center', cursor: 'pointer' }}>
            <Icon name="back" size={18}/>
          </button>
          <h3 style={{ fontFamily: PB.font, fontWeight: 800, fontSize: 18, letterSpacing: '-0.01em', margin: 0 }}>Tu llave digital</h3>
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 10px', borderRadius: 999, background: PB.successBg, color: PB.success, fontSize: 11, fontWeight: 700, letterSpacing: '.06em' }}>
            <span style={{ width: 6, height: 6, borderRadius: 999, background: PB.success }}/>
            <Icon name="wifi" size={12}/>
          </div>
        </div>

        {/* Countdown ring */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '12px 0 8px' }}>
          <svg width="220" height="220" viewBox="0 0 220 220">
            <circle cx="110" cy="110" r={R} fill="none" stroke={PB.surface2} strokeWidth="10"/>
            <circle cx="110" cy="110" r={R} fill="none" stroke={PB.morado} strokeWidth="10" strokeLinecap="round"
              strokeDasharray={C} strokeDashoffset={C * (1 - pct)}
              transform="rotate(-90 110 110)" style={{ transition: 'stroke-dashoffset 600ms' }}/>
            <text x="110" y="98" textAnchor="middle" fontFamily={PB.font} fontSize="11" fontWeight="700" letterSpacing="2" fill={PB.ink3}>TE QUEDAN</text>
            <text x="110" y="134" textAnchor="middle" fontFamily={PB.mono} fontSize="40" fontWeight="700" fill={PB.ink}>{mm}:{ss}</text>
          </svg>
          <div style={{ fontSize: 13, color: PB.ink3, marginTop: -6 }}>
            <strong style={{ color: PB.ink2, fontWeight: 700 }}>BOX 1</strong> · terminando a las 19:00h
          </div>
        </div>

        {/* Sliders */}
        <div style={{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
          <Slider label="Desliza · puerta calle" unlocked={streetUnlocked} onUnlock={() => setStreetUnlocked(true)}/>
          <Slider label="Desliza · puerta BOX 1" unlocked={boxUnlocked} onUnlock={() => setBoxUnlocked(true)}/>
        </div>

        {/* Ambient lights */}
        <div style={{ padding: '10px 20px 0' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
            <h3 style={{ fontFamily: PB.font, fontWeight: 800, fontSize: 15, letterSpacing: '-0.01em', margin: 0 }}>Ambiente del box</h3>
            <Eyebrow>LED</Eyebrow>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {lights.map(l => {
              const on = light === l.id;
              return (
                <button key={l.id} onClick={() => setLight(l.id)} style={{
                  flex: 1, padding: '14px 6px', borderRadius: 16, border: `1px solid ${on ? PB.morado : PB.line}`,
                  background: on ? PB.surface : PB.surface, cursor: 'pointer',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
                  boxShadow: on ? '0 4px 14px rgba(72,35,128,.15)' : 'none',
                }}>
                  <div style={{ width: 32, height: 32, borderRadius: 999, background: l.color, boxShadow: `0 0 18px ${l.color}` }}/>
                  <span style={{ fontFamily: PB.font, fontWeight: 700, fontSize: 12, color: PB.ink }}>{l.label}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* SOS */}
        <div style={{ padding: '18px 16px 8px' }}>
          <Button variant="danger" full icon="phone" style={{ padding: '14px', fontSize: 14 }}>
            Emergencia · Contactar soporte
          </Button>
        </div>
      </div>
      <TabBar active="llave"/>
    </>
  );
};

window.Screen4Key = Screen4Key;

</script>

// ─── Métodos de pago ─────────────────────────────────────────
const ScreenPaymentMethods = ({ onBack, onAdd }) => {

  const cards = [
    { id: 'mc', brand: 'Mastercard', last: '4242', exp: '12/28', color: '#1A1F36' },
    { id: 'visa', brand: 'Visa',     last: '0119', exp: '08/27', color: '#1A1F71' },

// ─── Booking ticket modal ────────────────────────────────────
const BookingTicket = ({ booking, onClose }) => {
  const [downloading, setDownloading] = React.useState(false);
  const [downloaded, setDownloaded] = React.useState(false);
  const b = booking;
  const stateTone = b.state === 'upcoming' ? { bg: PB.successBg, fg: PB.success, label: 'Próxima · pagada' }
                  : b.state === 'cancelled' ? { bg: PB.dangerBg, fg: PB.danger, label: 'Cancelada · reembolsada' }
                  : { bg: PB.mentaSoft, fg: PB.moradoInk, label: 'Completada' };

  const handleDownload = () => {
    if (downloading || downloaded) return;
    setDownloading(true);
    setTimeout(() => { setDownloading(false); setDownloaded(true); }, 1400);
    setTimeout(() => setDownloaded(false), 2400);
  };

  // QR pseudo-grid (deterministic from id)
  const qrCells = React.useMemo(() => {
    const seed = b.id.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
    const N = 21;
    const out = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      // finder squares (corners)
      const inFinder = (x,y) => (x < 7 && y < 7) || (x > N-8 && y < 7) || (x < 7 && y > N-8);
      if (inFinder(x,y)) {
        const fx = x < 7 ? x : N-1-x;
        const fy = y < 7 ? y : N-1-y;
        const ring = (fx === 0 || fx === 6 || fy === 0 || fy === 6);
        const inner = (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
        out.push(ring || inner ? 1 : 0);
      } else {
        out.push(((x*7 + y*13 + seed) % 11) % 3 === 0 ? 1 : 0);
      }
    }
    return out;
  }, [b.id]);

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 80,
      background: 'rgba(20,19,24,.55)', backdropFilter: 'blur(4px)',
      display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
      animation: 'pb-fade 220ms ease-out',
    }}>
      <style>{`
        @keyframes pb-fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pb-slideup { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pb-spin { to { transform: rotate(360deg); } }
      `}</style>
      <div onClick={onClose} style={{ flex: 1, cursor: 'pointer' }}/>
      <div style={{
        position: 'relative', maxHeight: '92%', overflowY: 'auto',
        padding: '0 14px 14px', animation: 'pb-slideup 320ms cubic-bezier(.2,.7,.2,1)',
      }}>
        {/* Close handle */}
        <div style={{ display: 'flex', justifyContent: 'center', padding: '8px 0' }}>
          <div style={{ width: 44, height: 5, borderRadius: 999, background: 'rgba(255,255,255,.6)' }}/>
        </div>

        {/* Ticket */}
        <div style={{ position: 'relative', filter: 'drop-shadow(0 18px 30px rgba(20,19,24,.25))' }}>
          <TicketShape>
            {/* Ticket header — morado strip */}
            <div style={{
              padding: '20px 22px 16px', background: PB.morado, color: '#fff',
              display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
            }}>
              <div>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.16em', opacity: .75 }}>RECIBO</div>
                <div style={{ marginTop: 4 }}><Wordmark color="#fff" height={24}/></div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '.14em', opacity: .75 }}>Nº RESERVA</div>
                <div style={{ fontFamily: PB.mono, fontWeight: 700, fontSize: 13, marginTop: 4 }}>{b.id}</div>
              </div>
            </div>

            {/* Estado */}
            <div style={{ padding: '14px 22px 4px' }}>
              <span style={{ display: 'inline-block', padding: '4px 10px', borderRadius: 999, background: stateTone.bg, color: stateTone.fg, fontSize: 11, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase' }}>{stateTone.label}</span>
            </div>

            {/* Detalle */}
            <div style={{ padding: '12px 22px 18px' }}>
              <h3 style={{ fontFamily: PB.font, fontWeight: 800, fontSize: 22, letterSpacing: '-.01em', margin: '0 0 4px' }}>{b.box}</h3>
              <div style={{ fontSize: 13, color: PB.ink3 }}>{b.sede}</div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginTop: 16 }}>
                <Detail label="Fecha" value={b.dateLong}/>
                <Detail label="Horario" value={b.hours} mono/>
                <Detail label="Duración" value={b.dur}/>
                <Detail label="Aforo" value="2 personas"/>
              </div>
            </div>

            {/* Perforación */}
            <Perforation/>

            {/* Línea de items */}
            <div style={{ padding: '16px 22px 8px' }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: PB.ink3, marginBottom: 10 }}>Concepto</div>
              <Line label={`${b.box}`} sub={`${b.dur} · ${b.hours}`} value={b.price}/>
              <Line label="Subtotal" value={b.subtotal} dim/>
              <Line label="IVA (21 %)" value={b.tax} dim/>
              <div style={{ height: 1, background: PB.line, margin: '10px 0' }}/>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{ fontFamily: PB.font, fontWeight: 800, fontSize: 16 }}>Total</span>
                <span style={{ fontFamily: PB.mono, fontWeight: 700, fontSize: 22, color: PB.ink, letterSpacing: '-.01em' }}>{b.total}</span>
              </div>
              <div style={{ marginTop: 10, fontSize: 12, color: PB.ink3, display: 'flex', alignItems: 'center', gap: 8 }}>
                <Icon name="card" size={14} color={PB.ink3}/> Pagado con {b.method}
              </div>
            </div>

            {/* Perforación */}
            <Perforation/>

            {/* QR */}
            <div style={{ padding: '18px 22px 22px', display: 'flex', gap: 16, alignItems: 'center' }}>
              <div style={{
                width: 96, height: 96, padding: 6, background: '#fff', borderRadius: 10,
                border: `1px solid ${PB.line}`,
                display: 'grid', gridTemplateColumns: 'repeat(21, 1fr)', gridTemplateRows: 'repeat(21, 1fr)', gap: 0,
              }}>
                {qrCells.map((c, i) => (
                  <div key={i} style={{ background: c ? PB.ink : 'transparent' }}/>
                ))}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: PB.ink3 }}>Verificación</div>
                <div style={{ fontFamily: PB.font, fontWeight: 700, fontSize: 13, marginTop: 4, color: PB.ink2 }}>Muestra este QR si el equipo de soporte te lo pide.</div>
                <div style={{ fontFamily: PB.mono, fontSize: 10, color: PB.ink3, marginTop: 6, wordBreak: 'break-all' }}>{b.id}-{b.n}-{b.m}</div>
              </div>
            </div>
          </TicketShape>
        </div>

        {/* Acciones */}
        <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <button onClick={handleDownload} disabled={downloading} style={{
            width: '100%', padding: '16px', borderRadius: 14, border: 0,
            background: downloaded ? PB.success : PB.ink, color: '#fff',
            fontFamily: PB.font, fontWeight: 700, fontSize: 15, letterSpacing: '-.005em',
            cursor: downloading ? 'wait' : 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
            transition: 'all 220ms cubic-bezier(.2,.7,.2,1)',
            boxShadow: '0 6px 18px rgba(20,19,24,.25)',
          }}>
            {downloading ? (<>
              <span style={{ width: 16, height: 16, borderRadius: 999, border: '2px solid rgba(255,255,255,.35)', borderTopColor: '#fff', animation: 'pb-spin 700ms linear infinite' }}/>
              Generando PDF…
            </>) : downloaded ? (<>
              <Icon name="check" size={18} color="#fff"/>
              Factura guardada
            </>) : (<>
              <Icon name="doc" size={18} color="#fff"/>
              Descargar factura
            </>)}
          </button>
          {b.state === 'upcoming' && (
            <button style={{
              width: '100%', padding: '14px', borderRadius: 14, border: `1px solid ${PB.line}`,
              background: PB.surface, color: PB.danger,
              fontFamily: PB.font, fontWeight: 700, fontSize: 14, cursor: 'pointer',
            }}>Cancelar reserva</button>
          )}
          <button onClick={onClose} style={{
            width: '100%', padding: '12px', borderRadius: 14, border: 0,
            background: 'transparent', color: '#fff',
            fontFamily: PB.font, fontWeight: 700, fontSize: 14, cursor: 'pointer',
          }}>Cerrar</button>
        </div>
      </div>
    </div>
  );
};

const OrderTicket = ({ order, onClose, fmt, total, tone }) => {
  const [downloading, setDownloading] = React.useState(false);
  const [downloaded, setDownloaded] = React.useState(false);
  const o = order;
  const t = tone(o.state);

  const handleDownload = () => {
    if (downloading || downloaded) return;
    setDownloading(true);
    setTimeout(() => { setDownloading(false); setDownloaded(true); }, 1400);
    setTimeout(() => setDownloaded(false), 2400);
  };

  // Precio bruto de artículos
  const itemsTotal = o.items.reduce((s, it) => s + it.price * it.qty, 0);
  const gross = itemsTotal + o.shipping;
  const subtotalExVat = gross / 1.21;
  const vat = gross - subtotalExVat;

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 80,
      background: 'rgba(20,19,24,.55)', backdropFilter: 'blur(4px)',
      display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
      animation: 'pb-fade 220ms ease-out',
    }}>
      <div onClick={onClose} style={{ flex: 1, cursor: 'pointer' }}/>
      <div style={{
        position: 'relative', maxHeight: '92%', overflowY: 'auto',
        padding: '0 14px 14px', animation: 'pb-slideup 320ms cubic-bezier(.2,.7,.2,1)',
      }}>
        {/* Handle */}
        <div style={{ display: 'flex', justifyContent: 'center', padding: '8px 0' }}>
          <div style={{ width: 44, height: 5, borderRadius: 999, background: 'rgba(255,255,255,.6)' }}/>
        </div>

        {/* Ticket */}
        <div style={{ position: 'relative', filter: 'drop-shadow(0 18px 30px rgba(20,19,24,.25))' }}>
          <TicketShape>
            {/* Header morado */}
            <div style={{
              padding: '20px 22px 16px', background: PB.morado, color: '#fff',
              display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
            }}>
              <div>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.16em', opacity: .75 }}>RECIBO</div>
                <div style={{ marginTop: 4 }}><Wordmark color="#fff" height={24}/></div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '.14em', opacity: .75 }}>Nº PEDIDO</div>
                <div style={{ fontFamily: PB.mono, fontWeight: 700, fontSize: 13, marginTop: 4 }}>{o.id}</div>
              </div>
            </div>

            {/* Estado */}
            <div style={{ padding: '14px 22px 4px' }}>
              <span style={{ display: 'inline-block', padding: '4px 10px', borderRadius: 999, background: t.bg, color: t.fg, fontSize: 11, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase' }}>{t.label}</span>
            </div>

            {/* Detalle de entrega */}
            <div style={{ padding: '12px 22px 18px' }}>
              <h3 style={{ fontFamily: PB.font, fontWeight: 800, fontSize: 20, letterSpacing: '-.01em', margin: '0 0 4px' }}>
                {o.delivery === 'locker' ? `Locker ${o.lockerId}` : 'Envío a domicilio'}
              </h3>
              <div style={{ fontSize: 13, color: PB.ink3 }}>
                {o.delivery === 'locker' ? `POLEBOX ${o.venueName}` : o.addr}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginTop: 16 }}>
                <Detail label="Fecha" value={o.date}/>
                <Detail label="Artículos" value={`${o.items.length} producto${o.items.length !== 1 ? 's' : ''}`}/>
                <Detail label="Entrega" value={o.delivery === 'locker' ? 'Locker sede' : 'A domicilio'}/>
                <Detail label="Pago" value={o.method}/>
              </div>
            </div>

            <Perforation/>

            {/* Concepto — items + desglose */}
            <div style={{ padding: '16px 22px 8px' }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: PB.ink3, marginBottom: 10 }}>Concepto</div>
              {o.items.map((it, i) => (
                <Line key={i} label={it.name} sub={`×${it.qty}`} value={fmt(it.price * it.qty)}/>
              ))}
              {o.shipping > 0 && <Line label="Envío" value={fmt(o.shipping)} dim/>}
              <Line label="Subtotal (sin IVA)" value={fmt(subtotalExVat)} dim/>
              <Line label="IVA (21 %)" value={fmt(vat)} dim/>
              <div style={{ height: 1, background: PB.line, margin: '10px 0' }}/>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{ fontFamily: PB.font, fontWeight: 800, fontSize: 16 }}>Total</span>
                <span style={{ fontFamily: PB.mono, fontWeight: 700, fontSize: 22, color: PB.ink, letterSpacing: '-.01em' }}>{fmt(total(o))}</span>
              </div>
              <div style={{ marginTop: 10, fontSize: 12, color: PB.ink3, display: 'flex', alignItems: 'center', gap: 8 }}>

            {o.delivery === 'locker' ? (

                </div>
              </div>
            ) : o.trackingEvents ? (
              <ShippingTracker events={o.trackingEvents} tracking={o.tracking}/>
            ) : (
              <div style={{ padding: '18px 22px 22px', display: 'flex', gap: 16, alignItems: 'center' }}>
                <div style={{ width: 72, height: 72, borderRadius: 14, background: PB.surface2, border: `1px solid ${PB.line}`, display: 'grid', placeItems: 'center', flexShrink: 0 }}>
                  <Icon name="refresh" size={30} color={PB.morado}/>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: PB.ink3 }}>Nº de seguimiento</div>
                  <div style={{ fontFamily: PB.mono, fontWeight: 700, fontSize: 15, color: PB.morado, letterSpacing: '.06em', marginTop: 4, wordBreak: 'break-all' }}>{o.tracking}</div>
                  <div style={{ fontSize: 11, color: PB.ink3, marginTop: 4 }}>Correos Express · {o.id}</div>
                </div>
              </div>
            )}
          </TicketShape>
        </div>

        {/* Acciones */}
        <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <button onClick={handleDownload} disabled={downloading} style={{
            width: '100%', padding: '16px', borderRadius: 14, border: 0,
            background: downloaded ? PB.success : PB.ink, color: '#fff',
            fontFamily: PB.font, fontWeight: 700, fontSize: 15, letterSpacing: '-.005em',
            cursor: downloading ? 'wait' : 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
            transition: 'all 220ms cubic-bezier(.2,.7,.2,1)',
            boxShadow: '0 6px 18px rgba(20,19,24,.25)',
          }}>
            {downloading ? (<>
              <span style={{ width: 16, height: 16, borderRadius: 999, border: '2px solid rgba(255,255,255,.35)', borderTopColor: '#fff', animation: 'pb-spin 700ms linear infinite' }}/>

            </>) : downloaded ? (<>
              <Icon name="check" size={18} color="#fff"/>
              Factura guardada
            </>) : (<>
              <Icon name="doc" size={18} color="#fff"/>
              Descargar factura
            </>)}
          </button>
          <button onClick={onClose} style={{
            width: '100%', padding: '12px', borderRadius: 14, border: 0,
            background: 'transparent', color: '#fff',
            fontFamily: PB.font, fontWeight: 700, fontSize: 14, cursor: 'pointer',
          }}>Cerrar</button>
        </div>
      </div>
    </div>
  );
};

<script type="text/babel">

  const [makeDefault, setMakeDefault] = React.useState(true);
  const [flipped, setFlipped] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [saved, setSaved] = React.useState(false);
  // ─── Escáner ────────────────────────────────────────────
  const [scan, setScan] = React.useState(null); // null | 'aiming' | 'capturing' | 'reading' | 'done'
  const [scanFlash, setScanFlash] = React.useState(false);
  const fileRef = React.useRef(null);

  // Simula escaneo OCR — rellena campos progresivamente
  const runScan = () => {
    setScan('aiming');
    setTimeout(() => {
      setScanFlash(true);
      setScan('capturing');
      setTimeout(() => setScanFlash(false), 220);
      setTimeout(() => setScan('reading'), 500);
      // OCR progresivo
      const fakeNum = '4242 4242 4242 4242';
      const fakeName = 'LAURA GÓMEZ';
      const fakeExp = '12/28';
      setTimeout(() => setNum(fakeNum.slice(0, 4)),  900);
      setTimeout(() => setNum(fakeNum.slice(0, 9)),  1100);
      setTimeout(() => setNum(fakeNum.slice(0, 14)), 1300);
      setTimeout(() => setNum(fakeNum), 1500);
      setTimeout(() => setName(fakeName), 1750);
      setTimeout(() => setExp(fakeExp), 1950);
      setTimeout(() => { setScan('done'); setTimeout(() => setScan(null), 600); }, 2200);
    }, 900);
  };
  const cancelScan = () => { setScan(null); setScanFlash(false); };

  // ─── Detección de marca ─────────────────────────────────
  const brand = (() => {
    const n = num.replace(/\s/g, '');
    if (/^4/.test(n)) return 'visa';
    if (/^(5[1-5]|2[2-7])/.test(n)) return 'mastercard';
    if (/^3[47]/.test(n)) return 'amex';
    return null;
  })();

  // ─── Formateo input ─────────────────────────────────────
  const formatNum = (v) => {
    const isAmex = /^3[47]/.test(v.replace(/\D/g, ''));
    const digits = v.replace(/\D/g, '').slice(0, isAmex ? 15 : 16);
    const groups = isAmex ? [4, 6, 5] : [4, 4, 4, 4];
    const out = [];
    let i = 0;
    for (const g of groups) {
      if (i >= digits.length) break;
      out.push(digits.slice(i, i + g));
      i += g;
    }
    return out.join(' ');
  };
  const formatExp = (v) => {
    const d = v.replace(/\D/g, '').slice(0, 4);
    if (d.length < 3) return d;
    return d.slice(0, 2) + '/' + d.slice(2);
  };

  // ─── Validación ─────────────────────────────────────────
  const numClean = num.replace(/\s/g, '');
  const numOk = brand && (brand === 'amex' ? numClean.length === 15 : numClean.length === 16);
  const nameOk = name.trim().length >= 3;
  const expOk = /^\d{2}\/\d{2}$/.test(exp) && (() => {
    const [m, y] = exp.split('/').map(Number);
    if (m < 1 || m > 12) return false;
    const now = new Date(); const yy = now.getFullYear() % 100; const mm = now.getMonth() + 1;
    return y > yy || (y === yy && m >= mm);
  })();
  const cvcOk = cvc.length === (brand === 'amex' ? 4 : 3);
  const formOk = numOk && nameOk && expOk && cvcOk;

  // ─── Submit ─────────────────────────────────────────────
  const submit = () => {
    if (!formOk || saving) return;
    setSaving(true);
    setTimeout(() => {
      setSaving(false); setSaved(true);
      setTimeout(() => onSaved && onSaved({ brand, last4: numClean.slice(-4), exp, makeDefault }), 900);
    }, 1400);
  };

  // ─── Brand mark ─────────────────────────────────────────

      </div>

    if (b === 'visa') return <div style={{ fontFamily: 'system-ui', fontWeight: 900, fontSize: big ? 22 : 14, color: '#fff', letterSpacing: '.04em', fontStyle: 'italic' }}>VISA</div>;
    if (b === 'amex') return <div style={{ fontFamily: 'system-ui', fontWeight: 800, fontSize: big ? 11 : 9, color: '#fff', letterSpacing: '.05em', padding: '4px 6px', border: '1.5px solid #fff', borderRadius: 4 }}>AMEX</div>;
    return <div style={{ display: 'flex', gap: 3 }}><div style={{ width: big ? 22 : 14, height: big ? 22 : 14, borderRadius: 999, background: 'rgba(255,255,255,.15)' }}/><div style={{ width: big ? 22 : 14, height: big ? 22 : 14, borderRadius: 999, background: 'rgba(255,255,255,.1)' }}/></div>;
  };

  // ─── Input atom ─────────────────────────────────────────
  const Field = ({ label, value, onChange, placeholder, type = 'text', mode, maxLength, valid, onFocus, onBlur, mono = false, autoComplete }) => {

            placeholder={placeholder} maxLength={maxLength}
            autoComplete={autoComplete}
            style={{
              width: '100%', boxSizing: 'border-box', padding: '14px 38px 14px 14px',
              borderRadius: 12, border: `1px solid ${showState ? (valid ? PB.success : PB.lineStrong) : PB.line}`,
              background: PB.surface, fontFamily: mono ? PB.mono : PB.font, fontWeight: mono ? 600 : 500,
              fontSize: 15, color: PB.ink, outline: 'none',
              transition: 'border-color 220ms',
            }}
            onFocusCapture={(e) => e.currentTarget.style.borderColor = PB.morado}
            onBlurCapture={(e) => e.currentTarget.style.borderColor = showState ? (valid ? PB.success : PB.lineStrong) : PB.line}
          />
          {showState && valid && (
            <div style={{ position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)', color: PB.success }}>
              <Icon name="check" size={18} color={PB.success}/>
            </div>
          )}
        </div>
      </label>
    );
  };

  // ─── Card preview ───────────────────────────────────────
  const cardBg = brand === 'visa' ? 'linear-gradient(135deg, #1A1F71, #2c2d8e)'

              : `linear-gradient(135deg, ${PB.moradoInk}, ${PB.morado})`;

  return (

            <Icon name="back" size={18}/>

            transition: 'transform 600ms cubic-bezier(.2,.7,.2,1)',
          }}>
            {/* FRONT */}
            <div style={{
              position: 'absolute', inset: 0, backfaceVisibility: 'hidden',
              borderRadius: 18, padding: 20, color: '#fff',
              background: cardBg,

              display: 'flex', flexDirection: 'column', justifyContent: 'space-between',

            }}>
              {/* shine */}
              <div style={{ position: 'absolute', top: -40, right: -60, width: 180, height: 180, borderRadius: 999, background: 'rgba(255,255,255,.08)', filter: 'blur(20px)' }}/>

              Tarjeta añadida
            </>
          ) : (
            <>
              <Icon name="lock" size={18} color={formOk ? '#fff' : PB.ink4}/>
              Añadir tarjeta
            </>
          )}
        </button>
      </div>

      <style>{`
        @keyframes pb-spin { to { transform: rotate(360deg); } }
        @keyframes pb-scan-line { 0% { top: 8%; } 50% { top: 86%; } 100% { top: 8%; } }
        @keyframes pb-pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
      `}</style>

      {/* ─── Cámara / escáner overlay ─────────────────────── */}
      {scan && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 90,
          background: '#000', overflow: 'hidden',
          display: 'flex', flexDirection: 'column',
          color: '#fff',
        }}>
          {/* Fake camera feed: blurred desk gradient */}

            position: 'absolute', inset: 0,
            background: 'radial-gradient(120% 80% at 30% 20%, #2a2433 0%, #0e0a18 60%, #000 100%)',

              borderRadius: 16,
              boxShadow: '0 0 0 9999px rgba(0,0,0,.55)',

              {/* Esquinas */}
              {[
                { top: -2, left: -2, br: '16px 0 0 0', bw: '3px 0 0 3px' },
                { top: -2, right: -2, br: '0 16px 0 0', bw: '3px 3px 0 0' },
                { bottom: -2, left: -2, br: '0 0 0 16px', bw: '0 0 3px 3px' },
                { bottom: -2, right: -2, br: '0 0 16px 0', bw: '0 3px 3px 0' },
              ].map((s, i) => (
                <div key={i} style={{
                  position: 'absolute', width: 28, height: 28,
                  borderColor: PB.menta, borderStyle: 'solid',
                  borderRadius: s.br, borderWidth: s.bw,
                  top: s.top, left: s.left, right: s.right, bottom: s.bottom,
                }}/>
              ))}
              {/* Línea de scan */}
              {scan === 'aiming' || scan === 'reading' ? (
                <div style={{
                  position: 'absolute', left: 8, right: 8, height: 2,
                  background: `linear-gradient(90deg, transparent, ${PB.menta}, transparent)`,
                  boxShadow: `0 0 18px ${PB.menta}`,
                  animation: 'pb-scan-line 1.6s ease-in-out infinite',
                  borderRadius: 999,
                }}/>
              ) : null}
              {/* OCR detection chips when reading */}
              {scan === 'reading' && (
                <>
                  {num && <div style={{ position: 'absolute', left: '8%', top: '52%', padding: '4px 8px', borderRadius: 6, background: 'rgba(128,227,183,.22)', border: `1px solid ${PB.menta}`, fontFamily: PB.mono, fontSize: 10, fontWeight: 700, color: PB.menta, letterSpacing: '.1em' }}>{num}</div>}
                  {name && <div style={{ position: 'absolute', left: '8%', bottom: '18%', padding: '4px 8px', borderRadius: 6, background: 'rgba(128,227,183,.22)', border: `1px solid ${PB.menta}`, fontSize: 10, fontWeight: 700, color: PB.menta, letterSpacing: '.06em' }}>{name}</div>}
                  {exp && <div style={{ position: 'absolute', right: '8%', bottom: '18%', padding: '4px 8px', borderRadius: 6, background: 'rgba(128,227,183,.22)', border: `1px solid ${PB.menta}`, fontFamily: PB.mono, fontSize: 10, fontWeight: 700, color: PB.menta }}>{exp}</div>}
                </>
              )}
              {/* Done check */}
              {scan === 'done' && (
                <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', background: 'rgba(35,143,91,.25)', borderRadius: 16, border: `2px solid ${PB.success}` }}>
                  <div style={{ width: 56, height: 56, borderRadius: 999, background: PB.success, display: 'grid', placeItems: 'center', boxShadow: `0 0 24px ${PB.success}` }}>
                    <Icon name="check" size={28} color="#fff"/>
                  </div>
                </div>
              )}
            </div>
            <div style={{
              position: 'absolute', bottom: 24, left: 24, right: 24, textAlign: 'center',
              fontFamily: PB.font, fontSize: 13, color: 'rgba(255,255,255,.85)',
            }}>
              {scan === 'aiming' && 'Coloca tu tarjeta dentro del marco…'}
              {scan === 'capturing' && 'Capturando…'}
              {scan === 'reading' && (<span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                <span style={{ width: 8, height: 8, borderRadius: 999, background: PB.menta, animation: 'pb-pulse 1s infinite' }}/>
                Leyendo datos…
              </span>)}
              {scan === 'done' && '¡Listo! Datos detectados.'}
            </div>
          </div>

          {/* Flash */}
          {scanFlash && <div style={{ position: 'absolute', inset: 0, background: '#fff', zIndex: 100 }}/>}
        </div>
      )}
    </>
  );
};

window.ScreenAddPayment = ScreenAddPayment;

</script>

                          <Icon name="plus" size={14} color="#fff"/>

                      </div>
                    )}

                </div>
              </div>
            );
          })}
        </div>
      </div>

      {totalItems > 0 && (
        <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '12px 16px 26px', background: 'rgba(250,250,247,.95)', backdropFilter: 'blur(12px)', borderTop: `1px solid ${PB.line}` }}>
          <button onClick={onCart} style={{
            width: '100%', padding: '16px 20px', borderRadius: 16, border: 0, cursor: 'pointer',
            background: PB.morado, color: '#fff', fontFamily: PB.font, fontWeight: 700, fontSize: 15,
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            boxShadow: '0 8px 22px rgba(72,35,128,.35)',

            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>

const ScreenStoreCart = ({ onBack, cart, setCart, onDelivery }) => {
  const [method, setMethod] = React.useState(null); // 'locker' | 'home'

  const add    = (id) => setCart(c => ({ ...c, [id]: (c[id] || 0) + 1 }));
  const remove = (id) => setCart(c => { const n = { ...c }; if (n[id] > 1) n[id]--; else delete n[id]; return n; });

  const subtotal = Object.entries(cart).reduce((sum, [id, qty]) => {
    const p = STORE_PRODUCTS.find(p => p.id === parseInt(id));
    return sum + (p ? p.price * qty : 0);
  }, 0);
  const shipping = method === 'home' ? 4.99 : 0;
  const total    = subtotal + shipping;
  const fmt      = (n) => n.toFixed(2).replace('.', ',') + ' €';
  const items    = Object.entries(cart).filter(([, q]) => q > 0);

  const methods = [
    {
      id: 'locker',
      icon: 'bolt',
      title: 'Recogida en locker',
      sub: 'Gratis · disponible al llegar a tu sede',
      badge: 'Gratis',
      badgeColor: PB.success,
      badgeBg: PB.successBg,
    },
    {
      id: 'home',
      icon: 'refresh',
      title: 'Envío a domicilio',
      sub: '4,99 € · 3–5 días hábiles · Correos Express',
      badge: '4,99 €',
      badgeColor: PB.warn,
      badgeBg: PB.warnBg,
    },
  ];

  return (
    <>
      <StatusBar/>
      <div style={{ flex: 1, overflowY: 'auto', paddingBottom: method ? 200 : 110 }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 16px 16px' }}>
          <button onClick={onBack} style={{ width: 40, height: 40, borderRadius: 12, border: `1px solid ${PB.line}`, background: PB.surface, display: 'grid', placeItems: 'center', cursor: 'pointer' }}>
            <Icon name="back" size={18}/>
          </button>
          <h3 style={{ fontFamily: PB.font, fontWeight: 800, fontSize: 20, letterSpacing: '-0.01em', margin: 0, flex: 1 }}>Tu carrito</h3>
          <span style={{ fontFamily: PB.mono, fontWeight: 700, fontSize: 13, color: PB.ink3 }}>{items.length} producto{items.length !== 1 ? 's' : ''}</span>
        </div>

        {/* Artículos */}
        <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
          {items.map(([id, qty]) => {
            const p = STORE_PRODUCTS.find(p => p.id === parseInt(id));
            if (!p) return null;
            return (
              <div key={id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: 14, borderRadius: 16, background: PB.surface, border: `1px solid ${PB.line}` }}>
                <div style={{ width: 44, height: 44, borderRadius: 12, background: p.color, display: 'grid', placeItems: 'center', flexShrink: 0 }}>
                  <Icon name={p.icon} size={20} color={PB.morado}/>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: PB.font, fontWeight: 700, fontSize: 14, color: PB.ink }}>{p.name}</div>
                  <div style={{ fontSize: 11, color: PB.ink3 }}>{p.sub}</div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <button onClick={() => remove(p.id)} style={{ width: 26, height: 26, borderRadius: 999, border: `1px solid ${PB.line}`, background: PB.surface2, display: 'grid', placeItems: 'center', cursor: 'pointer', fontWeight: 800, fontSize: 15, color: PB.ink }}>−</button>
                    <span style={{ fontFamily: PB.mono, fontWeight: 700, fontSize: 14, color: PB.morado, minWidth: 14, textAlign: 'center' }}>{qty}</span>
                    <button onClick={() => add(p.id)} style={{ width: 26, height: 26, borderRadius: 999, border: 0, background: PB.morado, display: 'grid', placeItems: 'center', cursor: 'pointer' }}>
                      <Icon name="plus" size={13} color="#fff"/>
                    </button>
                  </div>
                  <div style={{ fontFamily: PB.mono, fontWeight: 700, fontSize: 14, color: PB.ink, minWidth: 50, textAlign: 'right' }}>{fmt(p.price * qty)}</div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Método de entrega */}
        <div style={{ padding: '22px 16px 8px' }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: PB.ink3, marginBottom: 10 }}>¿Cómo lo recibes?</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {methods.map(m => {
              const sel = method === m.id;
              return (
                <button key={m.id} onClick={() => setMethod(m.id)} style={{
                  display: 'flex', alignItems: 'center', gap: 14,
                  padding: '14px 16px', borderRadius: 18, cursor: 'pointer', textAlign: 'left',
                  border: `2px solid ${sel ? PB.morado : PB.line}`,
                  background: sel ? 'rgba(72,35,128,.04)' : PB.surface,
                  boxShadow: sel ? '0 6px 18px rgba(72,35,128,.12)' : 'none',
                  transition: 'all 220ms cubic-bezier(.2,.7,.2,1)',
                }}>
                  <div style={{ width: 44, height: 44, borderRadius: 14, background: sel ? PB.morado : PB.surface2, display: 'grid', placeItems: 'center', flexShrink: 0, transition: 'background 220ms' }}>
                    <Icon name={m.icon} size={20} color={sel ? '#fff' : PB.morado}/>
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: PB.font, fontWeight: 700, fontSize: 15, color: PB.ink }}>{m.title}</div>
                    <div style={{ fontSize: 11, color: PB.ink3, marginTop: 2 }}>{m.sub}</div>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
                    <span style={{ padding: '3px 8px', borderRadius: 999, background: m.badgeBg, color: m.badgeColor, fontSize: 10, fontWeight: 800 }}>{m.badge}</span>
                    <div style={{ width: 20, height: 20, borderRadius: 999, border: `2px solid ${sel ? PB.morado : PB.lineStrong}`, background: sel ? PB.morado : 'transparent', display: 'grid', placeItems: 'center' }}>
                      {sel && <Icon name="check" size={11} color="#fff"/>}
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Desglose precios */}
        <div style={{ margin: '16px 16px 0', padding: '14px 16px', borderRadius: 16, background: PB.surface, border: `1px solid ${PB.line}` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: PB.ink2, marginBottom: 6 }}>
            <span>Subtotal</span><span style={{ fontFamily: PB.mono, fontWeight: 600 }}>{fmt(subtotal)}</span>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: PB.ink2, marginBottom: 8 }}>
            <span>Envío</span><span style={{ fontFamily: PB.mono, fontWeight: 600, color: shipping === 0 ? PB.success : PB.ink2 }}>{shipping === 0 ? 'Gratis' : fmt(shipping)}</span>
          </div>
          <div style={{ height: 1, background: PB.line, marginBottom: 8 }}/>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontFamily: PB.font, fontWeight: 800, fontSize: 15 }}>Total</span>
            <span style={{ fontFamily: PB.mono, fontWeight: 800, fontSize: 20, color: PB.ink }}>{fmt(total)}</span>
          </div>
        </div>
      </div>

      {/* CTA continuar */}
      {method && (
        <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '16px 16px 26px', background: PB.surface, boxShadow: '0 -12px 30px rgba(20,19,24,.1)', borderTop: `1px solid ${PB.line}`, borderTopLeftRadius: 28, borderTopRightRadius: 28 }}>
          <Button onClick={() => onDelivery(method)} full icon="arrow" style={{ padding: '18px', fontSize: 16 }}>
            {method === 'locker' ? 'Elegir sede y locker' : 'Introducir dirección'}
          </Button>
        </div>
      )}

    </>
  );
};

window.ScreenStoreCart = ScreenStoreCart;

</script>

            <button onClick={handleBuy} disabled={buying} style={{

};

<script type="text/babel">
// POLEBOX — main prototype router with guest flow + auth wall

function useScreen(key, init) {
  const [v, _set] = React.useState(() => {
    try { return localStorage.getItem(key) || init; } catch { return init; }
  });
  const set = (x) => { _set(x); try { localStorage.setItem(key, x); } catch {} };
  return [v, set];
}

function App() {
  const [screen, setScreen] = useScreen('pb_screen', 'home-public');
  const [authed, setAuthed] = useScreen('pb_authed', 'no');
  const [venueId, setVenueId] = useScreen('pb_venue', 'mad-salamanca');
  const [authWall, setAuthWall] = React.useState(null);
  const [booking, setBooking] = React.useState(null);

  // Bonos state
  const [userBonos, setUserBonos] = React.useState([{
    id: 'PB-BON-00012', catalogId: 'b10-60', name: 'Bono Mensual',
    accesos: 10, min: 60, usados: 3,
    purchaseDate: '1 nov 2025', expiryDate: '30 ene 2026', daysLeft: 91, state: 'active',
  }]);
  const [selectedBono, setSelectedBono] = React.useState(null);

  // Store state
  const [storeCart, setStoreCart] = React.useState({});
  const [storeDelivery, setStoreDelivery] = React.useState(null);
  const [storeAddress, setStoreAddress] = React.useState({});
  const [storePickup, setStorePickup] = React.useState(null);
  const [storeTotal, setStoreTotal] = React.useState(0);

  const isAuthed = authed === 'yes';

  const renderScreen = () => {
    switch (screen) {
      case 'home-public':
        return <Screen1Home
          onLogin={() => setAuthWall('login')}
          onRegister={() => setAuthWall('register')}
          onPickVenue={(id) => { setVenueId(id); setScreen('venue'); }}
        />;
      case 'venue':
        return <ScreenVenue
          venueId={venueId}
          onBack={() => setScreen(isAuthed ? 'dashboard' : 'home-public')}
          onBook={() => setScreen('book')}
        />;
      case 'dashboard':
        return <Screen2Dashboard
          onNewReservation={() => setScreen('book')}
          onOpenKey={() => setScreen('key')}
          onStore={() => setScreen('store')}
        />;
      case 'book':
        return <Screen3Book
          onBack={() => setScreen(isAuthed ? 'dashboard' : 'venue')}
          onPay={(b) => {
            setBooking(b);
            if (!isAuthed) setAuthWall('register');
            else setScreen('checkout');
          }}
        />;
      case 'checkout':
        return <ScreenCheckout
          booking={booking}
          userBonos={userBonos}
          onBack={() => setScreen('book')}
          onPay={(b) => { setBooking(b); setScreen('stripe'); }}
        />;
      case 'stripe':
        return <ScreenStripe
          booking={booking}
          onBack={() => setScreen('checkout')}
          onSuccess={() => setScreen('key')}
        />;
      case 'key':
        return <Screen4Key onBack={() => setScreen('dashboard')}/>;
      case 'profile':
        return <Screen5Profile
          onBack={() => setScreen('dashboard')}
          onLogout={() => { setAuthed('no'); setScreen('home-public'); }}
          onNav={(s) => setScreen(s)}
        />;
      case 'payment-methods':
        return <ScreenPaymentMethods onBack={() => setScreen('profile')} onAdd={() => setScreen('payment-add')}/>;
      case 'payment-add':
        return <ScreenAddPayment onBack={() => setScreen('payment-methods')} onSaved={() => setScreen('payment-methods')}/>;
      case 'history':
        return <ScreenHistory onBack={() => setScreen('profile')}/>;
      case 'contract':
        return <ScreenContract onBack={() => setScreen('profile')}/>;
      case 'kyc':
        return <ScreenKYC onBack={() => setScreen('profile')}/>;
      case 'support':
        return <ScreenSupport onBack={() => setScreen('profile')}/>;
      case 'faq':
        return <ScreenFAQ onBack={() => setScreen('profile')}/>;
      case 'order-history':
        return <ScreenOrderHistory onBack={() => setScreen('profile')}/>;
      case 'edit-profile':
        return <ScreenEditProfile onBack={() => setScreen('profile')}/>;
      case 'addresses':
        return <ScreenAddresses onBack={() => setScreen('profile')}/>;
      case 'mis-bonos':
        return <ScreenMisBonos
          userBonos={userBonos}
          onBack={() => setScreen('profile')}
          onComprar={() => setScreen('bonos')}
          onReservar={(bono) => { setSelectedBono(bono); setScreen('book'); }}
        />;
      case 'bonos':
        return <ScreenBonos
          onBack={() => setScreen('mis-bonos')}
          onPurchased={(newBono) => { setUserBonos(prev => [...prev, newBono]); setScreen('mis-bonos'); }}
        />;

      // ── Tienda ────────────────────────────────────────────
      case 'store':
        return <ScreenStore
          cart={storeCart} setCart={setStoreCart}
          onBack={() => setScreen('dashboard')}
          onCart={() => setScreen('store-cart')}
        />;
      case 'store-cart':
        return <ScreenStoreCart
          cart={storeCart} setCart={setStoreCart}
          onBack={() => setScreen('store')}
          onDelivery={(method) => {
            setStoreDelivery(method);
            setScreen(method === 'locker' ? 'store-pickup' : 'store-address');
          }}
        />;
      case 'store-address':
        return <ScreenStoreAddress
          onBack={() => setScreen('store-cart')}
          onConfirm={(addr) => { setStoreAddress(addr); setScreen('store-order'); }}
        />;
      case 'store-pickup':
        return <ScreenStorePickup
          onBack={() => setScreen('store-cart')}
          onConfirm={(p) => { setStorePickup(p); setScreen('store-order'); }}
        />;
      case 'store-order':
        return <ScreenStoreOrder
          cart={storeCart}
          delivery={storeDelivery}
          address={storeAddress}
          pickup={storePickup}
          onBack={() => setScreen(storeDelivery === 'locker' ? 'store-pickup' : 'store-address')}
          onPay={(t) => { setStoreTotal(t); setScreen('store-payment'); }}
        />;
      case 'store-payment':
        return <ScreenStorePayment
          total={storeTotal}
          onBack={() => setScreen('store-order')}
          onSuccess={() => setScreen('store-confirm')}
        />;
      case 'store-confirm':
        return <ScreenStoreConfirm
          cart={storeCart}
          delivery={storeDelivery}
          address={storeAddress}
          pickup={storePickup}
          onDone={() => { setStoreCart({}); setScreen('dashboard'); }}
        />;

      default:
        return null;
    }
  };

  const toolbarItems = [
    { id: 'home-public',    label: '01 · Home' },
    { id: 'venue',          label: '02 · Sede' },
    { id: 'dashboard',      label: '03 · Dashboard' },
    { id: 'book',           label: '04 · Reserva' },
    { id: 'checkout',       label: '05 · Resumen' },
    { id: 'stripe',         label: '06 · Stripe' },
    { id: 'key',            label: '07 · Llave' },
    { id: 'profile',        label: '08 · Perfil' },
    { id: 'store',          label: '09 · Tienda' },
    { id: 'store-cart',     label: '10 · Carrito' },
    { id: 'store-address',  label: '11 · Dirección' },
    { id: 'store-pickup',   label: '11 · Locker' },
    { id: 'store-order',    label: '12 · Pedido' },
    { id: 'store-payment',  label: '13 · Pago' },
    { id: 'store-confirm',  label: '14 · Confirmado' },
    { id: 'payment-add',    label: '+ Añadir tarjeta' },
    { id: 'order-history',  label: '+ Pedidos' },
    { id: 'edit-profile',   label: '+ Mi cuenta' },
    { id: 'addresses',      label: '+ Direcciones' },
    { id: 'mis-bonos',      label: '+ Mis bonos' },
    { id: 'bonos',          label: '+ Catálogo bonos' },
  ];

  return (
    <div style={{
      minHeight: '100vh', background: '#EDEBE3',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '24px 16px 40px', gap: 16,
      fontFamily: 'Archivo, system-ui, sans-serif',
    }}>
      <Toolbar screen={screen} setScreen={setScreen} authed={isAuthed} setAuthed={setAuthed} items={toolbarItems}/>
      <div data-screen-label={screen}>
        <Phone>
          {renderScreen()}
          {authWall && (
            <AuthWall
              mode={authWall}
              onClose={() => setAuthWall(null)}
              onSwitchMode={() => setAuthWall(authWall === 'login' ? 'register' : 'login')}
              onAuthed={() => {
                setAuthed('yes');
                setAuthWall(null);
                if (screen === 'book') setScreen('checkout');
                else if (screen === 'home-public') setScreen('dashboard');
              }}
            />
          )}
        </Phone>
      </div>
      <Footer/>
    </div>
  );
}

function Toolbar({ screen, setScreen, authed, setAuthed, items }) {
  return (
    <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center' }}>
      <div style={{
        display: 'flex', gap: 6, padding: 6, borderRadius: 999,
        background: '#fff', border: '1px solid #E2E0D8',
        boxShadow: '0 4px 14px rgba(20,19,24,.06)',
        flexWrap: 'wrap', justifyContent: 'center', maxWidth: 860,
      }}>
        {items.map(it => {
          const on = screen === it.id;
          return (
            <button key={it.id} onClick={() => setScreen(it.id)} style={{
              border: 0, padding: '10px 14px', borderRadius: 999, cursor: 'pointer',
              background: on ? '#482380' : 'transparent',
              color: on ? '#fff' : '#3A3742',
              fontFamily: 'Archivo, system-ui, sans-serif',
              fontWeight: 700, fontSize: 12, letterSpacing: '-.005em', lineHeight: 1.2,
              transition: 'all 220ms cubic-bezier(.2,.7,.2,1)', whiteSpace: 'nowrap',
            }}>
              {it.label}
            </button>
          );
        })}
      </div>
      <button onClick={() => setAuthed(authed ? 'no' : 'yes')} style={{
        border: `1px solid ${authed ? '#238F5B' : '#C9C6BC'}`,
        background: authed ? '#E4F6EC' : '#fff',
        color: authed ? '#238F5B' : '#3A3742',
        padding: '8px 14px', borderRadius: 999,
        fontFamily: 'Archivo, system-ui, sans-serif', fontWeight: 700, fontSize: 11,
        letterSpacing: '.08em', textTransform: 'uppercase', cursor: 'pointer',
      }}>
        {authed ? '● Logueada' : 'Invitada'}
      </button>
    </div>
  );
}

function Footer() {
  return (
    <div style={{
      fontFamily: 'Archivo, system-ui, sans-serif', fontSize: 11,
      color: '#6B6776', letterSpacing: '.14em', textTransform: 'uppercase',
      fontWeight: 700, marginTop: 4, textAlign: 'center', maxWidth: 480,
    }}>
      POLEBOX · prototipo interactivo
      <div style={{ marginTop: 6, letterSpacing: 0, textTransform: 'none', fontWeight: 500, color: '#A19DAB' }}>
        Flujo tienda: 09 Tienda → añade productos → Ver carrito → elige Locker o Domicilio → completa el pedido.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
